name: Release

on:
  push:
    branches: [main]
    # A push that only changes documentation releases nothing. Everything counts except
    # docs/ and Markdown, and of those the files a release carries count again. A manual
    # run always releases.
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - README.md # in every package
      - CHANGELOG.md # compiled into the app, shown under Settings → Updates
      - docs/releases.md # becomes the Homebrew tap's README
      - assets/webrtc/LICENSE.md # part of THIRD-PARTY-LICENSES.txt
      # The collection server ships as a container, not in the app. What the app shares
      # with it, crates/monster-core, still counts.
      - '!server/**'
      - '!.dockerignore'
      - '!.github/workflows/server.yml'
      # The Beelink runner's setup lives on the Beelink, not in the app.
      - '!.github/runner/**'
  workflow_dispatch:

permissions:
  contents: read

# No workflow-wide concurrency, which would cancel a publish halfway. A newer push cancels
# the older one's test and builds (their own concurrency groups), so that push is never
# released by itself: its commits are in the next release's notes. Publishing takes turns
# (see the publish job).

jobs:
  # Which platforms are built and published: the ones .github/platforms.json turns on (runners
  # and packages are in scripts/release.py). A release leaves the others out; their installs
  # see no update until they are back.
  platforms:
    if: github.repository == 'zirkumflex-group/flexspeak'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      test-os: ${{ steps.platforms.outputs.test-os }}
      test-cache: ${{ steps.platforms.outputs.test-cache }}
      macos: ${{ steps.platforms.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/platforms.json
            scripts/
          sparse-checkout-cone-mode: false
      - id: platforms
        env:
          # The Beelink's Windows runner (.github/runner/README.md), named in the repo variable
          # WINDOWS_RUNNER, takes runs by the people it trusts and never a fork's pull request;
          # everything else stays on GitHub's runner. The runner's own job hook checks again.
          FLEXSPEAK_WINDOWS_RUNNER: >-
            ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
            && contains(fromJSON('["yungtristxn","Jan-GJ"]'), github.actor)
            && contains(fromJSON('["yungtristxn","Jan-GJ"]'), github.triggering_actor)
            && vars.WINDOWS_RUNNER || '' }}
        run: python3 scripts/release.py platforms | tee -a "$GITHUB_OUTPUT"

  # The platforms are checked on every PR before it merges (ci.yml), so a release does not
  # repeat them. This catches what a PR cannot: a direct push, or two merges that each passed
  # alone. On one platform (the first that is on, Linux when it is), from the cache the
  # checks save, so it is done before the slowest build.
  test:
    needs: [platforms]
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ needs.platforms.outputs.test-os }}
    timeout-minutes: 45
    concurrency:
      group: release-test
      cancel-in-progress: true
    # As in ci.yml: rust-cache keys on Cargo's environment, and this job reads that cache.
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checks' own setup on each platform (ci.yml), or their cache isn't found.
      - name: Windows Dev Drive
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 20GB
          workspace-copy: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup
      - name: Windows static C runtime
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE || '.' }}
          shared-key: ${{ needs.platforms.outputs.test-cache }}
          # Saved by the checks on main, which also build Clippy's half of it.
          save-if: false
      # The self-hosted runner keeps Cargo's output between jobs instead of restoring a cache
      # (the Dev Drive and rust-cache steps are GitHub's runner only). The checks' directory:
      # the PR already built nearly all of this there, with the same settings and command.
      - name: Self-hosted build directory
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=$env:FLEXSPEAK_CI_DIR/target/checks" >> $env:GITHUB_ENV
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake pkg-config libasound2-dev libopus-dev libxkbcommon-dev libwayland-dev
      - name: Fetch Rust dependencies
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        timeout-minutes: 10
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: never
          GIT_HTTP_LOW_SPEED_LIMIT: '1000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
        run: cargo fetch --locked
      - working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo test --locked -p flexspeak -p monster-core

  # Builds run alongside the tests; nothing publishes unless both pass.
  build:
    name: Build (${{ matrix.platform }})
    needs: [platforms]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    concurrency:
      group: release-build-${{ matrix.platform }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changelog is built from the release tags' commit messages (scripts/release.py),
          # so it needs the history but not old file contents.
          fetch-depth: 0
          filter: blob:none
      # Windows is slow with the thousands of small files a Rust build unpacks and writes, so
      # the toolchain, Cargo's home and a copy of the checkout live on a ReFS Dev Drive. The
      # drive is not marked trusted, so Defender still scans it.
      - name: Windows Dev Drive
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 20GB
          workspace-copy: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE || '.' }}
          # A Mac cache from another image holds that image's Xcode paths and won't link.
          shared-key: release-${{ matrix.platform }}${{ runner.os == 'macOS' && '-26' || '' }}
          # Only main's caches help later releases; a branch's would only spend the quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache prunes unknown directories under target/, so Opus lives (and is cached) elsewhere.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ${{ runner.temp }}/opus
            !${{ runner.temp }}/opus/build
          # The build's own stamp also catches changed CMake options.
          key: opus-${{ matrix.platform }}-${{ hashFiles('scripts/opus.json') }}
      # The self-hosted runner keeps Cargo's output between jobs instead of restoring a cache
      # (the Dev Drive and rust-cache steps are GitHub's runner only).
      - name: Self-hosted build directory
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=$env:FLEXSPEAK_CI_DIR/target/release" >> $env:GITHUB_ENV
          "FLEXSPEAK_OPUS_DIR=$env:FLEXSPEAK_CI_DIR/opus" >> $env:GITHUB_ENV
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake pkg-config libasound2-dev libxkbcommon-dev libwayland-dev desktop-file-utils
      - name: macOS disk image tools
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-tools"
          "$RUNNER_TEMP/dmg-tools/bin/pip" install --require-hashes -r scripts/dmg-requirements.txt
          echo "FLEXSPEAK_DMGBUILD=$RUNNER_TEMP/dmg-tools/bin/dmgbuild" >> "$GITHUB_ENV"
      # Everything Cargo needs for this platform, before the build: release.py runs
      # `cargo metadata` and `cargo build` side by side, and a fetch in either would hold
      # Cargo's package lock. Through the git CLI, which shows progress and gives up on a
      # stalled transfer or a credential prompt (Cargo's built-in git hung on macOS). These
      # variables stay on this step: rust-cache keys on Cargo's environment.
      - name: Fetch Rust dependencies
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        timeout-minutes: 10
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: never
          GIT_HTTP_LOW_SPEED_LIMIT: '1000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
        run: python scripts/release.py fetch
      - name: Build and package
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          FLEXSPEAK_OPUS_DIR: ${{ env.FLEXSPEAK_OPUS_DIR || format('{0}/opus', runner.temp) }}
          # Nothing may reach the network after the fetch (build scripts' own downloads,
          # such as the prebuilt libwebrtc, are not Cargo's and still work).
          CARGO_NET_OFFLINE: 'true'
          # The runner image's Python, whatever its version, reads and writes UTF-8.
          PYTHONUTF8: '1'
        run: python scripts/release.py build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}/dist/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [platforms, test, build]
    # Only main publishes. The `release` environment admits main alone, and holds the tap's
    # deploy key, so a workflow edited on a branch can neither publish nor read the key.
    if: github.ref == 'refs/heads/main'
    environment: release
    # One publish at a time, and every waiting one keeps its place (GitHub would otherwise
    # cancel all but the newest waiting job). They can come in any order, since a quick
    # build overtakes a slow one: the steps below never move "latest" or the tap back.
    concurrency:
      group: release-publish
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/releases
      - name: Publish complete release
        id: release
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python3 scripts/release.py checksums
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release-state.json" 2>/dev/null; then
            if python3 -c 'import json,sys; sys.exit(not json.load(open(sys.argv[1]))["isDraft"])' "$RUNNER_TEMP/release-state.json"; then
              gh release upload "$tag" dist/releases/* --clobber
            else
              # Published assets are immutable, including on workflow reruns.
              gh release download "$tag" --dir dist/releases --clobber
            fi
          else
            git log -1 --format=%B "$GITHUB_SHA" > "$RUNNER_TEMP/commit.txt"
            python3 scripts/release.py notes "$RUNNER_TEMP/commit.txt" "$RUNNER_TEMP/notes.md"
            gh release create "$tag" dist/releases/* --draft --target "$GITHUB_SHA" \
              --title "Flexspeak ${version} — build ${GITHUB_RUN_NUMBER}" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          # Latest as soon as every package is up, so in-app updates never wait for the
          # Homebrew step below. A rerun of an older build never moves the mark back.
          latest=true
          current=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [[ "$current" =~ -build\.([0-9]+)$ ]] && (( BASH_REMATCH[1] > GITHUB_RUN_NUMBER )); then
            latest=false
          fi
          gh release edit "$tag" --draft=false --latest="$latest"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release.json"
      # Only while macOS is on: the cask is the DMG's.
      - name: Checkout Homebrew tap
        if: needs.platforms.outputs.macos == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zirkumflex-group/homebrew-flexspeak
          ref: main
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      # If this fails, the release is already out and the app already offers it; rerun the
      # job to bring Homebrew up to date.
      - name: Update Homebrew tap
        if: needs.platforms.outputs.macos == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [[ -f homebrew-tap/.release-run ]] && (( GITHUB_RUN_NUMBER < $(cat homebrew-tap/.release-run) )); then
            echo "A newer Homebrew build is already published."
            exit 0
          fi
          python3 scripts/release.py cask "$RUNNER_TEMP/release.json" homebrew-tap/Casks/flexspeak.rb
          cp docs/releases.md homebrew-tap/README.md
          printf '%s\n' "$GITHUB_RUN_NUMBER" > homebrew-tap/.release-run
          git -C homebrew-tap config user.name 'github-actions[bot]'
          git -C homebrew-tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C homebrew-tap add Casks/flexspeak.rb README.md .release-run
          if ! git -C homebrew-tap diff --cached --quiet; then
            git -C homebrew-tap commit -m "Update Flexspeak to $RELEASE_TAG"
            git -C homebrew-tap push origin main
          fi
