name: Checks

# No paths filter: these checks are required on main, and a filtered-out PR would never
# report them and could not merge. They run again on main after every merge: that run is
# the one that saves the build caches PRs start from, and it shows a merge that only
# broke in combination with another. Releases do not wait for it (see release.yml).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    # Windows and macOS compile code Linux never sees (libwebrtc, NVENC, Windows capture,
    # the macOS app), so all three platforms lint and test before anything merges.
    name: Format, lint, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cache: linux-checks
          - os: windows-2022
            cache: windows-checks
          # The release builds on macOS 26 too; its Xcode is the one that matters.
          - os: macos-26
            cache: macos-26-checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      # audiopus_sys builds its bundled Opus with a CMakeLists that CMake 4 rejects otherwise.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As in the release build: Windows is slow with the many small files Cargo writes.
      - name: Windows Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 20GB
          workspace-copy: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup
      # The prebuilt libwebrtc uses the static C runtime, as the release build does. Set
      # before rust-cache, which keys on Cargo's environment.
      - name: Windows static C runtime
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy
      # Formatting is the same everywhere; Linux checks it once.
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Release script tests
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          if command -v python3 > /dev/null; then python=python3; else python=python; fi
          "$python" -m unittest discover -s scripts -p 'test_*.py'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE || '.' }}
          shared-key: ${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake pkg-config libasound2-dev libopus-dev libxkbcommon-dev libwayland-dev
      # Git dependencies through the git CLI, which shows progress and gives up on a stalled
      # transfer or a credential prompt instead of hanging (Cargo's built-in git hung on macOS).
      - name: Fetch Rust dependencies
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        timeout-minutes: 10
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: never
          GIT_HTTP_LOW_SPEED_LIMIT: '1000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
        run: cargo fetch --locked
      - working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo test --locked

  # The one status check main requires: its name stays the same whichever runners the
  # matrix above uses.
  passed:
    name: Checks passed
    needs: [check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every platform passed
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          echo "Format, lint, test: $RESULT"
          [ "$RESULT" = success ]
