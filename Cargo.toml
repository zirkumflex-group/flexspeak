[package]
name = "flexspeak"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A minimal native TeamSpeak voice client"

[workspace]
members = ["."]
exclude = ["vendor/tsclientlib"]

[dependencies]
anyhow = "1"
audiopus = "0.3.0-rc.0"
audiopus_sys = { version = "0.2.2", features = ["static"] }
cpal = "0.18.2"
cpu-time = "1"
crossbeam-queue = "0.3"
directories = "6"
futures = "0.3"
global-hotkey = "0.9"
# Update checks and downloads. TLS through rustls on ring: no extra C toolchain on any platform.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "2ceefd2418b63cf33adb51ef83383c68bc0ffea5" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "2ceefd2418b63cf33adb51ef83383c68bc0ffea5" }
# The video compositor needs wgpu's types; the same version and features Rune already builds.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
rubato = { version = "0.16.2", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", default-features = false }
tsclientlib = { path = "vendor/tsclientlib", default-features = false, features = ["audio"] }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
# For saved identities that tsclientlib cannot load back (see `recover_identity`).
tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
base64 = "0.22"
nnnoiseless = { version = "0.5.2", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
resvg = { version = "0.45.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVAudioApplication", "block2"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
libwebrtc = "=0.3.54"
# Named only to switch off libaom's software AV1 encoder: AV1 is then offered only
# when a hardware encoder (NVENC) provides it, and sharing otherwise stays on VP8.
webrtc-sys = { version = "=0.3.51", features = ["no-software-av1-encoder"] }
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(windows)'.dependencies]
# Experimental fast capture (src/streaming/wgc.rs): Windows Graphics Capture and the D3D11
# video processor. Also shared system audio without the app's own sound
# (src/streaming/process_audio.rs). The same version Rune, wgpu and cpal already build.
windows = { version = "0.62", features = ["Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture"] }
# Named for `#[implement]`, which expands to paths in it (process_audio's completion handler).
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# No cross-crate LTO: thin LTO made every release rebuild of this crate ~4x slower
# (≈3 extra CI minutes per runner). Its runtime benefit was never measured; Opus is C.
strip = "debuginfo"

[profile.release.build-override]
# macOS 27 rejects misaligned LINKEDIT pools in stripped procedural-macro dylibs.
# Keep build-time plugins loadable; the application remains optimized and stripped.
strip = "none"

[build-dependencies]
cc = "1"
embed-resource = "3"
# Keep this aligned with the helper used by the pinned libwebrtc dependency.
webrtc-sys-build = "=0.3.21"

# webrtc-sys with the NVENC hardware encoders built on Windows, from
# zirkumflex-group/rust-sdks, branch flexspeak/windows-nvenc (based on webrtc-sys v0.3.51).
# The rev is also tagged flexspeak/webrtc-sys-v0.3.51-nvenc.2 there, so it stays fetchable.
[patch.crates-io]
webrtc-sys = { git = "https://github.com/zirkumflex-group/rust-sdks", rev = "6469898101c8cfa7fdda0215246eba52bc46778a" }
webrtc-sys-build = { git = "https://github.com/zirkumflex-group/rust-sdks", rev = "6469898101c8cfa7fdda0215246eba52bc46778a" }
# cpal 0.18.2 with one change: the macOS loopback tap leaves the app's own sound out, so
# shared system audio does not echo the call back to viewers. Windows does the same in
# src/streaming/process_audio.rs.
cpal = { git = "https://github.com/zirkumflex-group/cpal", rev = "bbde53916e936766b6b7bb7fb781fe760c3b4633" }
