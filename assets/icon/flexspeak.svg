<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Flexspeak: Zirkumflex's circumflex as a folded ribbon on a round badge. -->
  <defs>
    <linearGradient id="badge" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4f4fc4"/>
      <stop offset="0.55" stop-color="#2a2585"/>
      <stop offset="1" stop-color="#16124a"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.35" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#c3cdff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb2ff"/>
      <stop offset="1" stop-color="#6575f0"/>
    </linearGradient>
  </defs>
  <circle cx="512" cy="512" r="464" fill="url(#badge)"/>
  <circle cx="512" cy="512" r="464" fill="url(#sheen)"/>
  <circle cx="512" cy="512" r="460" fill="none" stroke="url(#rim)" stroke-width="8"/>
  <!-- The right leg runs down from behind the left leg's top, so the caret reads as one folded strip. -->
  <g transform="translate(512 512) scale(1.12) translate(-528 -512)">
    <path d="M478 300 H602 L800 618 H676 Z" fill="url(#back)"/>
    <path d="M260 724 H396 L602 300 H466 Z" fill="url(#front)"/>
  </g>
</svg>
